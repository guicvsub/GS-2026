name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t semaforofacil:ci ./app

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (segredos vazados)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep (vulnerabilidades no código)
        run: |
          pip install semgrep
          semgrep scan --config auto --error app pipeline
      - name: Build para o Trivy
        run: docker build -t semaforofacil:ci ./app
      - name: Trivy (vulnerabilidades na imagem)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: semaforofacil:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
